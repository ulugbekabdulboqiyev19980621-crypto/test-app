<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MIZON TAʼLIM</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #faf6f0;
      --surface: #fffdf9;
      --warm-card: #f3ece1;
      --text: #1c2430;
      --muted: #616c7a;
      --navy: #1e3a5f;
      --navy-deep: #152944;
      --gold: #c88a2e;
      --gold-soft: #fdf2e0;
      --rose-soft: #faeae5;
      --rose-text: #8b3a28;
      --border: #eadfce;
      --shadow: 0 10px 28px rgba(30, 58, 95, 0.06);
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding-bottom: 90px;
      min-height: 100vh;
    }

    .app {
      max-width: 640px;
      margin: 0 auto;
      padding: 14px 14px 24px;
    }

    .topbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--navy), var(--navy-deep));
      color: #f9d99a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(21, 41, 68, 0.2);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.2px;
      color: var(--navy-deep);
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .pill-badge {
      background: var(--gold-soft);
      color: #8c5a12;
      border: 1px solid #f0d7ac;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .hero-card {
      background: linear-gradient(135deg, #23426b 0%, #162a46 100%);
      color: #fffdf9;
      border-radius: 24px;
      padding: 22px 18px;
      box-shadow: 0 14px 30px rgba(22, 42, 70, 0.18);
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      right: -36px;
      top: -36px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(224, 169, 78, 0.25) 0%, rgba(224, 169, 78, 0) 70%);
      pointer-events: none;
    }

    .hero-tag {
      display: inline-block;
      background: rgba(249, 217, 154, 0.16);
      color: #f8d898;
      border: 1px solid rgba(249, 217, 154, 0.32);
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }

    .hero-title {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .hero-desc {
      font-size: 13.5px;
      color: rgba(255, 253, 249, 0.92);
      line-height: 1.52;
    }

    .avatar-circle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(249, 217, 154, 0.18);
      border: 1px solid rgba(249, 217, 154, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      color: #f9d99a;
      flex-shrink: 0;
    }

    .hero-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      position: relative;
      z-index: 1;
    }

    .hero-btn {
      border: none;
      border-radius: 13px;
      padding: 10px 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .hero-btn:active {
      transform: scale(0.98);
    }

    .hero-btn.gold {
      background: #f3c97b;
      color: #3a2406;
    }

    .hero-btn.light {
      background: #fffdf9;
      color: var(--navy-deep);
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--navy-deep);
      margin-bottom: 6px;
    }

    .panel-text {
      font-size: 13.5px;
      color: var(--muted);
    }
