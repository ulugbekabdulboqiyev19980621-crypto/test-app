    :root {

      -webkit-tap-highlight-color: transparent;
    }

    body {

    .app {

    .topbar {

      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 14px;

      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--teal-mid), var(--teal-dark));

      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 6px 14px rgba(20, 92, 104, 0.22);

    }

    .pill-badge {
      background: var(--teal-light);
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .hero-title {

      line-height: 1.25;

    .hero-desc {

      font-weight: 700;

      color: #ffffff;

    }
